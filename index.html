document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

section>\n\n  <!-- FEATURES -->\n  <section id=\"features\" style=\"background:var(--bg-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:clamp(60px,7vw,108px) clamp(20px,5vw,48px)\">\n      <div style=\"max-width:660px;margin-bottom:52px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:16px\">The platform<\u002Fdiv>\n        <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(32px,4.4vw,54px);line-height:1.04;letter-spacing:-1px;margin:0;color:var(--text)\">Everything you need to run a business inside WhatsApp.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px\">\n        <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);margin-bottom:16px\">01<\u002Fdiv>\n          <h3 style=\"font-weight:700;font-size:18px;margin:0 0 9px;color:var(--text)\">Visual bot flows<\u002Fh3>\n          <p style=\"font-size:14.5px;line-height:1.6;color:var(--text-2);margin:0\">Versioned, validated conversation graphs with keyword, button, and list-reply triggers — compiled and cached in memory for fast execution.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);margin-bottom:16px\">02<\u002Fdiv>\n          <h3 style=\"font-weight:700;font-size:18px;margin:0 0 9px;color:var(--text)\">Rivets plugins<\u002Fh3>\n          <p style=\"font-size:14.5px;line-height:1.6;color:var(--text-2);margin:0\">Drop-in conversational modules like Form and Track &amp; Trace, each with its own record store, import/export, and per-tier limits.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);margin-bottom:16px\">03<\u002Fdiv>\n          <h3 style=\"font-weight:700;font-size:18px;margin:0 0 9px;color:var(--text)\">Conversational commerce<\u002Fh3>\n          <p style=\"font-size:14.5px;line-height:1.6;color:var(--text-2);margin:0\">Cart → order → checkout with Shopify, WooCommerce, and Meta Catalog. Product recommendations and order-timeline tracking built in.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);margin-bottom:16px\">04<\u002Fdiv>\n          <h3 style=\"font-weight:700;font-size:18px;margin:0 0 9px;color:var(--text)\">Marketing that converts<\u002Fh3>\n          <p style=\"font-size:14.5px;line-height:1.6;color:var(--text-2);margin:0\">Abandoned-cart nudges, A/B campaigns with auto-tuning, and message-to-conversion attribution — so you know what actually sells.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);margin-bottom:16px\">05<\u002Fdiv>\n          <h3 style=\"font-weight:700;font-size:18px;margin:0 0 9px;color:var(--text)\">Native WhatsApp Flows<\u002Fh3>\n          <p style=\"font-size:14.5px;line-height:1.6;color:var(--text-2);margin:0\">Encrypted data-exchange forms rendered natively inside WhatsApp, with key management and phone registration handled for you.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);margin-bottom:16px\">06<\u002Fdiv>\n          <h3 style=\"font-weight:700;font-size:18px;margin:0 0 9px;color:var(--text)\">Multi-tenant &amp; secure<\u002Fh3>\n          <p style=\"font-size:14.5px;line-height:1.6;color:var(--text-2);margin:0\">Per-workspace data isolation, role-based access (Owner → Viewer), and secrets encrypted at rest. Run every client from one dashboard.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- RIVETS -->\n  <section id=\"rivets\" style=\"max-width:1180px;margin:0 auto;padding:clamp(60px,7vw,108px) clamp(20px,5vw,48px)\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:clamp(28px,4vw,56px);align-items:center\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:16px\">The Rivets framework<\u002Fdiv>\n        <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(32px,4.4vw,54px);line-height:1.04;letter-spacing:-1px;margin:0 0 18px;color:var(--text)\">Drop-in automations that snap onto any bot.<\u002Fh2>\n        <p style=\"font-size:16.5px;line-height:1.65;color:var(--text-2);margin:0 0 24px\">Rivets are tenant-scoped conversational plugins layered over the bot pipeline. Attach one to a bot, configure it, and it takes over the conversation when its trigger matches — collecting structured data or answering lookups, then handing control back.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:13px\">\n          <div style=\"display:flex;gap:11px;align-items:flex-start\"><span style=\"color:var(--accent);font-weight:700;margin-top:1px\">✓<\u002Fspan><span style=\"font-size:15px;color:var(--text-2)\"><b style=\"color:var(--text)\">Import &amp; export<\u002Fb> — bring records in from .xlsx / .csv with schema inference, push them back out to XLSX / JSON.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:11px;align-items:flex-start\"><span style=\"color:var(--accent);font-weight:700;margin-top:1px\">✓<\u002Fspan><span style=\"font-size:15px;color:var(--text-2)\"><b style=\"color:var(--text)\">Per-turn state<\u002Fb> — each conversation keeps its own context between messages, persisted automatically.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:11px;align-items:flex-start\"><span style=\"color:var(--accent);font-weight:700;margin-top:1px\">✓<\u002Fspan><span style=\"font-size:15px;color:var(--text-2)\"><b style=\"color:var(--text)\">Tier-aware<\u002Fb> — record creation scales with your subscription, enforced automatically.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:18px\">\n        <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px\">\n          <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:14px\">\n            <div style=\"width:40px;height:40px;border-radius:11px;background:var(--accent-soft);border:1px solid var(--accent-line);display:flex;align-items:center;justify-content:center\"><span style=\"width:16px;height:16px;border:2px solid var(--accent);border-radius:4px;display:block\"><\u002Fspan><\u002Fdiv>\n            <div style=\"font-weight:700;font-size:19px;color:var(--text)\">Form<\u002Fdiv>\n            <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);border:1px solid var(--accent-line);padding:4px 9px;border-radius:999px\">PLUGIN<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size:14.5px;line-height:1.6;color:var(--text-2);margin:0\">Collect fields across turns — text, number, date, SA phone number, email, yes/no — with validation, retries, and a confirmation summary before the record saves.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px\">\n          <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:14px\">\n            <div style=\"width:40px;height:40px;border-radius:11px;background:var(--accent-soft);border:1px solid var(--accent-line);display:flex;align-items:center;justify-content:center\"><span style=\"width:16px;height:16px;border:2px solid var(--accent);border-radius:50%;display:block\"><\u002Fspan><\u002Fdiv>\n            <div style=\"font-weight:700;font-size:19px;color:var(--text)\">Track &amp; Trace<\u002Fdiv>\n            <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);border:1px solid var(--accent-line);padding:4px 9px;border-radius:999px\">PLUGIN<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size:14.5px;line-height:1.6;color:var(--text-2);margin:0\">Customers send a reference number and get a live, templated status back from your shipment records — imported straight from a spreadsheet.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- USE CASES -->\n  <section id=\"usecases\" style=\"background:var(--bg-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:clamp(60px,7vw,108px) clamp(20px,5vw,48px)\">\n      <div style=\"max-width:660px;margin-bottom:52px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:16px\">Use cases<\u002Fdiv>\n        <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(32px,4.4vw,54px);line-height:1.04;letter-spacing:-1px;margin:0;color:var(--text)\">One platform, many jobs.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px\">\n        <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px\">\n          <div style=\"font-family:'Instrument Serif',serif;font-size:26px;color:var(--text);margin-bottom:12px\">E-commerce stores<\u002Fdiv>\n          <p style=\"font-size:15px;line-height:1.6;color:var(--text-2);margin:0\">Sell products in-chat, recover abandoned carts, take payments through PayFast, and send order updates automatically. Sync your Shopify or WooCommerce catalog in a click.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px\">\n          <div style=\"font-family:'Instrument Serif',serif;font-size:26px;color:var(--text);margin-bottom:12px\">Customer support<\u002Fdiv>\n          <p style=\"font-size:15px;line-height:1.6;color:var(--text-2);margin:0\">Deflect repetitive FAQs, route conversations to the right flow, and keep humans in the loop with a shared inbox and AI conversation summaries.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px\">\n          <div style=\"font-family:'Instrument Serif',serif;font-size:26px;color:var(--text);margin-bottom:12px\">Onboarding &amp; alerts<\u002Fdiv>\n          <p style=\"font-size:15px;line-height:1.6;color:var(--text-2);margin:0\">Auto-provision a workspace when a new client onboards, then send proactive WhatsApp notifications — student updates, appointment reminders, alerts — through the connected number.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- RELIABILITY (contrast band) -->\n  <section style=\"background:var(--band-bg);color:var(--band-text)\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:clamp(60px,7vw,108px) clamp(20px,5vw,48px)\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:clamp(32px,5vw,60px);align-items:center\">\n        <div>\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:16px\">Built to be trusted<\u002Fdiv>\n          <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(32px,4.4vw,54px);line-height:1.04;letter-spacing:-1px;margin:0 0 18px;color:var(--band-text)\">Messages that can't afford to get lost.<\u002Fh2>\n          <p style=\"font-size:16.5px;line-height:1.65;color:var(--band-text-2);margin:0 0 22px\">Every reply and its outbound record are written in the same database transaction, then published to the send queue. Nothing is dropped, nothing goes out twice — even under load, retries, and rate limits.<\u002Fp>\n          <div style=\"display:flex;gap:26px;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--band-text-2)\">\n            <span>.NET 9<\u002Fspan><span>PostgreSQL<\u002Fspan><span>RabbitMQ<\u002Fspan><span>Encrypted secrets<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:var(--band-surface);border:1px solid var(--band-line);border-radius:18px;padding:28px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--band-text-2);letter-spacing:.08em;text-transform:uppercase;margin-bottom:20px\">Transactional outbox pipeline<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:12px;font-family:'JetBrains Mono',monospace;font-size:13px\">\n            <div style=\"display:flex;align-items:center;gap:12px\"><span style=\"flex:1;background:rgba(255,255,255,.05);border:1px solid var(--band-line);border-radius:9px;padding:11px 14px;color:var(--band-text)\">Inbound webhook<\u002Fspan><\u002Fdiv>\n            <div style=\"color:var(--accent);text-align:center;line-height:1\">↓<\u002Fdiv>\n            <div style=\"display:flex;align-item ground: 'var(--text)', color: 'var(--bg)' };\n    const idle = { background: 'transparent', color: 'var(--text-2)' };\n\n    const faqData = [\n      { q: 'Do my customers need to install anything?', a: 'No. Everything happens inside WhatsApp — the app your customers already use. There is nothing for them to download, log into, or learn.' },\n      { q: 'Do I need to write code?', a: 'No. You build bots visually by dragging keyword, button, and list triggers into flows, and you can start from a pre-built Pack. Rivets plugins add richer behaviour with configuration, not code.' },\n      { q: 'Which WhatsApp API does Rivet use?', a: \"Rivet runs on the official Meta WhatsApp Cloud API (Graph v24.0), with signature-verified webhooks, message-template management, and native WhatsApp Flows.\" },\n      { q: 'Can I connect my existing store?', a: 'Yes — sync your catalog from Shopify, WooCommerce, or Meta Catalog. Carts, orders, product recommendations, and order tracking all work in-chat.' },\n      { q: 'How are payments handled?', a: 'Through PayFast, with support for recurring and once-off billing, subscription profiles, and reconciliation — sandbox and live.' },\n      { q: 'Is my data isolated from other businesses?', a: 'Yes. Rivet is multi-tenant by design: every record carries a workspace boundary, access is role-based (Owner → Viewer), and secrets are encrypted at rest.' },\n    ];\n\n    return {\n      containerRef: this.containerRef,\n      showAnnouncement: this.props.announcement ?? true,\n      isDark: this.effectiveTheme() === 'Dark',\n      isLight: this.effectiveTheme() !== 'Dark',\n      toggleTheme: () => this.setState(s => ({ theme: (s.theme ?? this.props.theme ?? 'Light') === 'Dark' ? 'Light' : 'Dark' })),\n      priceStarter: price('starter'),\n      priceGrowth: price('growth'),\n      priceBusiness: price('business'),\n      priceAgency: price('agency'),\n      billingNote: ann ? '/mo · billed annually' : '/month',\n      setMonthly: () => this.setState({ annual: false }),\n      setAnnual: () => this.setState({ annual: true }),\n      monthlyStyle: { ...btnBase, ...(ann ? idle : active) },\n      annualStyle: { ...btnBase, ...(ann ? active : idle) },\n      faqs: faqData.map((f, i) => ({\n        q: f.q,\n        a: f.a,\n        open: this.state.openFaq === i,\n        closed: this.state.openFaq !== i,\n        toggle: () => this.setState(s => ({ openFaq: s.openFaq === i ? -1 : i })),\n      })),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
